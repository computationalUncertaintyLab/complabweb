baseURL: "https://compuncertlab.org" 
title: Computational Uncertainty Lab
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: Books
          url: books/
          weight: 5 
        - name: Research Products
          url: papers/
          weight: 2
        - name: Courses
          url: courses/
          weight: 3
        - name: Data
          url: data/
          weight: 4 
        - name: Lab members
          url: members/
          weight: 1
        - name: Lab Docs
          url: lab_docs/
          weight: 6
        - name: Apps
          url: apps/
          weight: 7

params:
    description: "Computational scientist,infectious diseases,forecasting"
    author: tom mcandrew
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["books","courses","papers","data"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: ""
          subtitle: ""
          imageUrl: "compuncertlab.png"
          imageWidth: 220
          imageHeight: 220
          buttons:
            - name: Lab members
              url: members/
            - name: Courses
              url: courses/
            - name: Research Products
              url: papers/
            - name: Data
              url: data/
            - name: Books
              url: books/
            - name: Lab Docs
              url: lab_docs/
            - name: Apps
              url: apps/

    # Personal contact links live on the PI profile (/members/mcandrew/), not the home splash.
    socialIcons: []

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: false
    members:
        useClassicList: false   # true = old PaperMod list cards
        enableCardExpand: true  # false = cards stay flat, no expand UI
    courses:
        useClassicList: false   # true = old PaperMod list cards
    papers:
        useClassicList: false   # true = old PaperMod list cards
    label:
      text: "Computational Uncertainty Lab"
      icon: compuncertlab.png
      iconHeight: 28

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2